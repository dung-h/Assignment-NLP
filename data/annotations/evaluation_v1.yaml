version: 1
scope: grammar_v0
target_turns: 84
scope_frames:
  - ASK_COURSE_ATTRIBUTE
  - ASK_COURSE_PARTS
  - ASK_EXAM_ATTRIBUTE
  - ASK_INSTRUCTOR
  - ASK_WEEK_CONTENT
  - ASK_WEEK_OF_CHAPTER
  - ASK_WEEK_OF_TOPIC
  - ASK_CHAPTER_CONTENT
  - ASK_CHAPTER_BY_TOPIC
  - ASK_TOPIC_OF_CHAPTER
  - ASK_TOPIC_EXISTENCE_IN_CHAPTER
  - ASK_ASSIGNMENT_INFO
  - ASK_ASSIGNMENT_PART_INFO
  - ASK_ASSIGNMENT_COMPONENT_EXISTENCE
  - ASK_ASSIGNMENT_OUTPUTS
  - ASK_ASSIGNMENT_TEAM_SIZE
  - ASK_ASSIGNMENT_DEADLINE
  - ASK_REGULATION
  - ASK_PERMISSION
  - ASK_RESOURCE_BY_TOPIC
  - ASK_RESOURCE_BY_CHAPTER
  - ASK_LO_DESCRIPTION
  - ASK_LO_RELATED_CONTENT
  - ASK_CHAPTER_BY_LO
cases:
  - id: G001
    split: development
    group: independent
    query: "Môn NLP có bao nhiêu tín chỉ?"
    provenance: data/raw/course_info.txt
    expected:
      parser: {valid: true, sentence_type: WH_QUESTION, query_frame: ASK_COURSE_ATTRIBUTE, tree: non_empty}
      semantic: {intent: GET_COURSE_INFO, entities: {course: [CO3085]}, attribute: credits, answer_mode: VALUE}
      retrieval: {status: FOUND, values: [3], sources: [course_info:CO3085]}
      answer: {contains: ["3 tín chỉ", "course_info:CO3085"]}
  - id: G002
    split: held_out
    group: independent
    query: "Môn học gồm những phần nào?"
    provenance: data/raw/course_info.txt
    expected:
      parser: {valid: true, sentence_type: WH_QUESTION, query_frame: ASK_COURSE_PARTS, tree: non_empty}
      semantic: {intent: GET_COURSE_INFO, entities: {}, attribute: parts, answer_mode: LIST}
      retrieval: {status: FOUND, values_include: ["Part I - Syntactic Processing", "Part II - Semantic Interpretation", "Part III - Context and World Knowledge"], sources: [course_info:CO3085]}
      answer: {contains: ["Part I - Syntactic Processing", "course_info:CO3085"]}
  - id: G003
    split: development
    group: independent
    query: "Midterm bao nhiêu phút?"
    provenance: data/raw/course_info.txt
    expected:
      parser: {valid: true, sentence_type: WH_QUESTION, query_frame: ASK_EXAM_ATTRIBUTE, tree: non_empty}
      semantic: {intent: GET_COURSE_INFO, entities: {exam: [MIDTERM]}, attribute: duration, answer_mode: VALUE}
      retrieval: {status: FOUND, values: [60], sources: [course_info:CO3085]}
      answer: {contains: ["60 phút", "course_info:CO3085"]}
  - id: G004
    split: held_out
    group: independent
    query: "Ai dạy môn NLP?"
    provenance: data/raw/course_info.txt
    expected:
      parser: {valid: true, sentence_type: WH_QUESTION, query_frame: ASK_INSTRUCTOR, tree: non_empty}
      semantic: {intent: GET_INSTRUCTOR, entities: {course: [CO3085]}, attribute: name, answer_mode: LIST}
      retrieval: {status: NOT_FOUND, values: [], sources: []}
