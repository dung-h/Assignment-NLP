      retrieval: {status: FOUND, values: [WEEK_03, WEEK_07], sources: [schedule:WEEK_03, schedule:WEEK_07]}
      answer: {contains: [WEEK_03, WEEK_07], exact: "Được học ở: WEEK_03 (Tuần 3), WEEK_07 (Tuần 7). Nguồn: schedule:WEEK_03, schedule:WEEK_07."}
